<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>平板檢修記錄</title>
<meta name="description" content="資訊車平板檢修記錄表：整車批次檢查、待修追蹤、匯出 Excel 報表">
<meta name="theme-color" content="#070d18">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#070d18; --bg2:#0b1424; --panel:#0f1b2e; --panel2:#132239; --line:#1f3352; --line2:#2a4570;
  --text:#e6f0ff; --muted:#8aa0c0; --dim:#5d7396;
  --accent:#22d3ee; --accent2:#3b82f6; --accent-ink:#04202a;
  --ok:#34d399; --ok-bg:rgba(52,211,153,.10);
  --bad:#f87171; --bad-bg:rgba(248,113,113,.13);
  --warn:#fbbf24; --warn-bg:rgba(251,191,36,.13);
  --fix:#60a5fa; --fix-bg:rgba(96,165,250,.13);
  --mono:ui-monospace,"JetBrains Mono","Roboto Mono","SF Mono",Menlo,Consolas,monospace;
  --sans:"Noto Sans TC","Google Sans","Roboto",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --r:14px;
  --nav-h:64px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.5}
body{
  min-height:100dvh;
  background:
    radial-gradient(1200px 500px at 110% -10%, rgba(34,211,238,.10), transparent 60%),
    radial-gradient(900px 400px at -20% 0%, rgba(59,130,246,.10), transparent 60%),
    linear-gradient(var(--bg),var(--bg));
  background-attachment:fixed;
}
body::before{ /* subtle grid */
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(120,160,220,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(120,160,220,.05) 1px,transparent 1px);
  background-size:28px 28px;
  mask-image:linear-gradient(to bottom,black,transparent 70%);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:20;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
  background:rgba(7,13,24,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;
}
.logo{width:36px;height:36px;border-radius:10px;flex:none;
  background:linear-gradient(135deg,#0e7490,#1d4ed8);display:grid;place-items:center;
  box-shadow:0 0 0 1px rgba(34,211,238,.35),0 0 18px rgba(34,211,238,.25)}
.logo svg{width:22px;height:22px}
.htitle{flex:1;min-width:0}
.htitle h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.02em}
.htitle .sub{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.14em;text-transform:uppercase}
.hclock{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;line-height:1.3}

main{position:relative;z-index:1;padding:14px 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 96px);max-width:720px;margin:0 auto}
.view{display:none}
.view.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- panels ---------- */
.panel{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;position:relative}
.panel-h{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:12px;font-family:var(--mono);color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.panel-h::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.panel-h .r{margin-left:auto;text-transform:none;letter-spacing:0}
label.f{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
.row{display:flex;gap:10px;align-items:center}
.row > *{min-width:0}

input[type=date],input[type=text],select,textarea{
  width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:10px;
  padding:11px 12px;font-size:16px;outline:none;
}
input[type=date]{font-family:var(--mono)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,211,238,.18)}
::-webkit-calendar-picker-indicator{filter:invert(.8) sepia(1) hue-rotate(150deg) saturate(3)}
textarea{min-height:78px;resize:vertical}

/* cart chips */
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{
  border:1px solid var(--line2);background:var(--bg);border-radius:10px;padding:10px 0;
  font-weight:700;font-size:15px;text-align:center;position:relative;transition:.12s;
}
.chip small{font-weight:400;color:var(--dim);font-size:11px;margin-left:1px}
.chip.on{border-color:var(--accent);background:rgba(34,211,238,.12);color:#cffafe;box-shadow:inset 0 0 0 1px var(--accent),0 0 14px rgba(34,211,238,.2)}
.chip.on small{color:#a5f3fc}
.chip .dot{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--ok)}
#otherWrap{margin-top:8px;display:none}

/* record state banner */
.state{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:2px 2px 10px}
.state .tag{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line2);letter-spacing:.06em}
.state .tag.new{color:var(--accent);border-color:rgba(34,211,238,.5)}
.state .tag.edit{color:var(--warn);border-color:rgba(251,191,36,.5)}
.state .tag.dirty{color:var(--bad);border-color:rgba(248,113,113,.5)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.stat b{display:block;font-family:var(--mono);font-size:24px;line-height:1.15}
.stat span{font-size:12px;color:var(--muted)}
.stat.ok b{color:var(--ok)} .stat.bad b{color:var(--bad)} .stat.warn b{color:var(--warn)}

/* tablet grid */
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.tile{
  aspect-ratio:1/1.08;border-radius:11px;border:1px solid var(--line2);background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;padding:4px 2px;
  transition:transform .08s;
}
.tile:active{transform:scale(.94)}
.tile .no{font-family:var(--mono);font-size:19px;font-weight:700;letter-spacing:.02em}
.tile .iss{display:flex;gap:2px;min-height:18px}
.tile .iss i{font-style:normal;font-size:11px;line-height:16px;padding:0 3px;border-radius:4px;background:rgba(248,113,113,.22);color:#fecaca}
.tile .ok{font-size:11px;color:var(--dim);line-height:18px}
.tile .note{position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:2px;background:var(--accent)}
.tile.s-ok{border-color:rgba(52,211,153,.28)}
.tile.s-ok .no{color:#bbf7d0}
.tile.s-bad{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 0 12px rgba(248,113,113,.18)}
.tile.s-send{border-color:var(--warn);background:var(--warn-bg)}
.tile.s-send .iss i{background:rgba(251,191,36,.22);color:#fde68a}
.tile.s-fix{border-color:var(--fix);background:var(--fix-bg)}
.tile.s-fix .iss i{background:rgba(96,165,250,.22);color:#bfdbfe}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid}
.lg-ok::before{border-color:var(--ok)!important}
.lg-bad::before{background:var(--bad-bg);border-color:var(--bad)!important}
.lg-send::before{background:var(--warn-bg);border-color:var(--warn)!important}
.lg-fix::before{background:var(--fix-bg);border-color:var(--fix)!important}
.lg-note::before{background:var(--accent);border-color:var(--accent)!important;width:7px!important;height:7px!important}
.legend .abbr{width:100%;color:var(--dim)}

.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
.empty .big{font-size:34px;opacity:.6}

/* buttons */
.btn{border:1px solid var(--line2);background:var(--panel2);border-radius:11px;padding:11px 14px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{filter:brightness(1.2)}
.btn.primary{background:linear-gradient(135deg,#06b6d4,#2563eb);border-color:transparent;color:#fff;box-shadow:0 6px 20px rgba(14,165,233,.3)}
.btn.ghost{background:transparent}
.btn.danger{color:#fecaca;border-color:rgba(248,113,113,.45);background:rgba(248,113,113,.08)}
.btn.sm{padding:7px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.4;pointer-events:none}
.btn svg{width:18px;height:18px}
.w100{width:100%}

.savebar{
  position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));z-index:15;
  padding:10px 16px;background:linear-gradient(to top,rgba(7,13,24,.97) 60%,rgba(7,13,24,0));
  display:none;
}
.savebar.show{display:block}
.savebar .in{max-width:720px;margin:0 auto;display:flex;gap:10px}
.savebar .btn{padding:13px}

/* bottom nav */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(9,16,29,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
}
nav .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
nav button{background:none;border:0;color:var(--dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;position:relative}
nav button svg{width:23px;height:23px}
nav button.on{color:var(--accent)}
nav button.on::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.badge{position:absolute;top:7px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;font-family:var(--mono);line-height:17px;text-align:center;display:none}
.badge.show{display:block}

/* bottom sheet */
.scrim{position:fixed;inset:0;background:rgba(2,6,14,.62);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:720px;margin:0 auto;
  background:linear-gradient(180deg,#12213a,#0b1424);border:1px solid var(--line2);border-bottom:0;
  border-radius:20px 20px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .24s cubic-bezier(.2,.8,.2,1);max-height:92dvh;overflow:auto;
}
.sheet.show{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 10px}
.sh-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.sh-head .no{font-family:var(--mono);font-size:34px;font-weight:800;color:var(--accent);line-height:1;text-shadow:0 0 18px rgba(34,211,238,.4)}
.sh-head .meta{color:var(--muted);font-size:13px}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;margin-bottom:8px;border-radius:12px;border:1px solid var(--line2);background:var(--bg);text-align:left;font-size:16px}
.opt .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line2);flex:none;display:grid;place-items:center}
.opt.round .box{border-radius:50%}
.opt.on .box{background:var(--accent);border-color:var(--accent)}
.opt.on .box::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.opt.on{border-color:var(--accent);background:rgba(34,211,238,.08)}
.opt.okopt.on{border-color:var(--ok);background:var(--ok-bg)}
.opt.okopt.on .box{background:var(--ok);border-color:var(--ok)}
.opt.bad.on{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad.on .box{background:var(--bad);border-color:var(--bad)}
.opt .hint{margin-left:auto;font-size:12px;color:var(--dim);font-family:var(--mono)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line2);border-radius:11px;overflow:hidden;background:var(--bg)}
.seg button{border:0;background:none;padding:10px 0;font-size:14px;font-weight:600;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on[data-v="待修"]{background:var(--bad-bg);color:#fecaca}
.seg button.on[data-v="已送修"]{background:var(--warn-bg);color:#fde68a}
.seg button.on[data-v="已修復"]{background:var(--fix-bg);color:#bfdbfe}
.sec-label{font-size:12px;font-family:var(--mono);letter-spacing:.12em;color:var(--muted);margin:14px 0 8px;text-transform:uppercase}
.sh-nav{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;margin-top:14px}

/* history / tracking cards */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1px solid var(--line2);background:var(--bg);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--muted)}
.fchip.on{border-color:var(--accent);color:var(--accent);background:rgba(34,211,238,.08)}
.rec{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:8px}
.rec .cart{width:46px;height:46px;flex:none;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:17px;background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.45);color:#bfdbfe;text-align:center;line-height:1.05}
.rec .cart.other{font-size:12px}
.rec .body{flex:1;min-width:0}
.rec .d{font-family:var(--mono);font-size:15px;font-weight:600}
.rec .d small{color:var(--muted);font-weight:400;margin-left:4px;font-family:var(--sans)}
.rec .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .s b{color:var(--bad);font-weight:600}
.rec .s .g{color:var(--ok)}
.rec .acts{display:flex;gap:6px}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}
.iconbtn.del{color:#fca5a5}
.month{font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:.1em;margin:14px 2px 8px}

.trk{padding:12px;border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:12px;background:var(--bg);margin-bottom:8px}
.trk.st-已送修{border-left-color:var(--warn)}
.trk.st-已修復{border-left-color:var(--fix);opacity:.75}
.trk .top{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.trk .top .t{font-weight:700;font-size:16px}
.trk .top .t span{font-family:var(--mono);color:var(--accent);font-size:18px}
.trk .top .dd{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.trk .is{font-size:14px;color:#fecaca;margin-bottom:4px}
.trk .nt{font-size:13px;color:var(--muted);margin-bottom:8px;word-break:break-all}
.trk .seg button{padding:8px 0;font-size:13px}

.check{display:flex;align-items:center;gap:10px;padding:10px 0;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)} .kv b{font-family:var(--mono);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note-s{font-size:12.5px;color:var(--dim);margin-top:8px;line-height:1.6}

/* toast + dialog */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 84px);transform:translate(-50%,20px);z-index:60;
  background:#e6f0ff;color:#071226;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;max-width:88vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.dlg{position:fixed;inset:0;z-index:70;display:none;place-items:center;padding:24px;background:rgba(2,6,14,.7)}
.dlg.show{display:grid}
.dlg .card{width:100%;max-width:380px;background:#12213a;border:1px solid var(--line2);border-radius:16px;padding:18px}
.dlg h3{margin:0 0 8px;font-size:17px}
.dlg p{margin:0 0 16px;color:var(--muted);font-size:14.5px;white-space:pre-line}
.dlg .acts{display:flex;gap:10px;justify-content:flex-end}
</style>
</head>
<body>

<header>
  <div class="logo" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="#e0fbff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2.5" width="14" height="19" rx="2.5"/><path d="M9 12.5l2.2 2.2L15.5 10"/><path d="M11 18.5h2"/></svg>
  </div>
  <div class="htitle">
    <h1>資訊車平板檢修記錄</h1>
    <div class="sub">Tablet · Inspection · Log</div>
  </div>
  <div class="hclock" id="hclock"></div>
</header>

<main>
  <!-- ===== 檢修 ===== -->
  <section class="view active" id="v-inspect">
    <div class="panel">
      <div class="panel-h">檢查設定</div>
      <label class="f" for="inDate">日期</label>
      <input type="date" id="inDate">
      <label class="f" style="margin-top:12px">資訊車</label>
      <div class="chips" id="cartChips"></div>
      <div id="otherWrap"><input type="text" id="inOther" placeholder="輸入車名，例如：G車、圖書館車" maxlength="20"></div>
    </div>

    <div id="inspectBody"></div>
  </section>

  <!-- ===== 紀錄 ===== -->
  <section class="view" id="v-history">
    <div class="filters" id="histFilters"></div>
    <div id="histList"></div>
  </section>

  <!-- ===== 追蹤 ===== -->
  <section class="view" id="v-track">
    <div class="panel" style="padding:12px 14px">
      <div class="row" style="justify-content:space-between">
        <div style="font-size:14px;color:var(--muted)">所有異常且尚未修復的平板</div>
        <label class="check" style="padding:0;font-size:13px;color:var(--muted)"><input type="checkbox" id="showFixed"> 含已修復</label>
      </div>
    </div>
    <div id="trackList"></div>
  </section>

  <!-- ===== 匯出 ===== -->
  <section class="view" id="v-export">
    <div class="panel">
      <div class="panel-h">Excel 報表</div>
      <div class="grid2">
        <div><label class="f" for="exFrom">開始日期</label><input type="date" id="exFrom"></div>
        <div><label class="f" for="exTo">結束日期</label><input type="date" id="exTo"></div>
      </div>
      <div class="filters" id="exRange" style="margin-top:10px;margin-bottom:4px"></div>
      <label class="f" style="margin-top:8px">資訊車（可複選）</label>
      <div class="filters" id="exCarts" style="flex-wrap:wrap"></div>
      <label class="check"><input type="checkbox" id="exOnlyBad"> 明細只列出異常平板</label>
      <div id="exPreview" style="margin:6px 0 12px"></div>
      <div class="grid2">
        <button class="btn primary" id="btnXlsx">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>下載 Excel</button>
        <button class="btn" id="btnShare">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></svg>分享 Excel</button>
      </div>
      <div class="note-s">報表工作表依序為：統計摘要、各車明細（A車～F車、其他車各一張）、待修清單、平板異常次數。「分享」可直接傳到 LINE、Gmail 或雲端硬碟。</div>
    </div>

    <div class="panel">
      <div class="panel-h">資料管理</div>
      <div id="dataInfo"></div>
      <div class="grid2" style="margin-top:12px">
        <button class="btn" id="btnBackup">備份資料</button>
        <button class="btn" id="btnRestore">還原備份</button>
      </div>
      <input type="file" id="fileRestore" accept=".json,application/json" hidden>
      <button class="btn danger w100" id="btnWipe" style="margin-top:10px">清除全部資料</button>
      <div class="note-s">資料只存在這支手機的這個 App 裡。建議每學期按「備份資料」存一份到雲端硬碟；換手機時用「還原備份」匯回。</div>
    </div>
    <div style="text-align:center;font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.1em">TABLET·CHECK v1.2</div>
  </section>
</main>

<div class="savebar" id="savebar"><div class="in">
  <button class="btn ghost" id="btnAllOk" style="flex:none">全部正常</button>
  <button class="btn primary" id="btnSave" style="flex:1">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span id="saveTxt">儲存紀錄</span></button>
</div></div>

<nav><div class="in">
  <button data-v="inspect" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2.5" width="14" height="19" rx="2.5"/><path d="M9 12.5l2.2 2.2L15.5 10"/></svg>檢修</button>
  <button data-v="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>紀錄</button>
  <button data-v="track"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3.5 17.5a1.5 1.5 0 0 0 2.1 2.1l5.8-5.8a4 4 0 0 0 5.4-5.4l-2.4 2.4-2.1-.6-.6-2.1z"/></svg>追蹤<span class="badge" id="trkBadge"></span></button>
  <button data-v="export"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M3.5 9h17M9 9v11.5M3.5 14.5h17"/></svg>匯出</button>
</div></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div class="sh-head"><div class="no" id="shNo">01</div><div class="meta" id="shMeta"></div></div>
  <div id="shOpts"></div>
  <div id="shStatusWrap">
    <div class="sec-label">處理狀態</div>
    <div class="seg" id="shSeg"></div>
  </div>
  <div class="sec-label">備註</div>
  <textarea id="shNote" placeholder="例如：螢幕裂痕、已更換新線、送廠商 11/05 取回…" maxlength="200"></textarea>
  <div class="sh-nav">
    <button class="btn" id="shPrev">‹ 上一台</button>
    <button class="btn" id="shNext">下一台 ›</button>
    <button class="btn primary" id="shDone">完成</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="dlg" id="dlg"><div class="card"><h3 id="dlgT"></h3><p id="dlgP"></p><div class="acts"><button class="btn ghost" id="dlgNo">取消</button><button class="btn primary" id="dlgYes">確定</button></div></div></div>

<script src="exceljs.min.js" defer></script>
<script>
"use strict";
/* ================= constants ================= */
const CARTS = ["A","B","C","D","E","F"];
const ISSUES = ["充電座故障","充電線失效","平板無法充電"];
const ISSUE_ABBR = {"充電座故障":"座","充電線失效":"線","平板無法充電":"電"};
const STATUSES = ["待修","已送修","已修復"];
const N = 40;
const NOS = Array.from({length:N},(_,i)=>String(i+1).padStart(2,"0"));
const K_REC = "tic.records.v1", K_DRAFT = "tic.draft.v1";
const WD = ["日","一","二","三","四","五","六"];

/* ================= utils ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parseD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const wd = s => WD[parseD(s).getDay()];
const fmtD = s => s.replace(/-/g,"/");
const buzz = (ms=8) => { try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} };
const blankTablets = () => NOS.map(no=>({no,issues:[],status:"",note:""}));
const cartLabel = (cart,other) => cart==="其他" ? (other ? `其他：${other}` : "其他車") : `${cart}車`;
const cartShort = r => r.cart==="其他" ? (r.other||"其他") : r.cart;
const recId = (date,cart,other) => `${date}|${cart==="其他" ? "其他:"+(other||"").trim() : cart}`;
const tState = t => !t.issues.length ? "ok" : t.status==="已修復" ? "fix" : t.status==="已送修" ? "send" : "bad";

function load(key,fb){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fb; }catch(e){ return fb; } }
function store(key,v){ try{ localStorage.setItem(key,JSON.stringify(v)); return true; }catch(e){ toast("⚠ 儲存失敗：手機儲存空間不足？"); return false; } }

let records = load(K_REC,[]);
const saveRecords = () => store(K_REC,records);
const findRec = id => records.find(r=>r.id===id);

/* ================= toast / dialog ================= */
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2200); }
function confirmBox(title,msg,yes="確定",danger=false){
  return new Promise(res=>{
    $("#dlgT").textContent=title; $("#dlgP").textContent=msg;
    const y=$("#dlgYes"), n=$("#dlgNo");
    y.textContent=yes; y.className = "btn " + (danger?"danger":"primary");
    $("#dlg").classList.add("show");
    const done=v=>{ $("#dlg").classList.remove("show"); y.onclick=n.onclick=null; res(v); };
    y.onclick=()=>done(true); n.onclick=()=>done(false);
  });
}

/* ================= header clock ================= */
function tick(){ const d=new Date(); $("#hclock").innerHTML = `${ymd(d).replace(/-/g,".")}<br>週${WD[d.getDay()]} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
tick(); setInterval(tick,15000);

/* ================= editor state ================= */
let ed = load(K_DRAFT,null);
if(!ed || !ed.dirty){ ed = {date:today(),cart:"",other:"",tablets:blankTablets(),dirty:false}; }
const saveDraft = () => store(K_DRAFT,ed);
const edId = () => ed.cart ? recId(ed.date,ed.cart,ed.other) : null;

function loadEditorFor(date,cart,other){
  const id = cart ? recId(date,cart,other) : null;
  const r = id && findRec(id);
  ed = {date,cart,other,tablets: r ? JSON.parse(JSON.stringify(r.tablets)) : blankTablets(),dirty:false};
  saveDraft();
}
async function guardDirty(){
  if(!ed.dirty) return true;
  return confirmBox("尚未儲存",`${cartLabel(ed.cart,ed.other)}（${fmtD(ed.date)}）的檢查結果還沒儲存，要放棄這些變更嗎？`,"放棄變更",true);
}
function markDirty(){ ed.dirty=true; saveDraft(); renderInspectBody(); }

/* ================= inspect view ================= */
function renderCartChips(){
  const todayRecs = new Set(records.filter(r=>r.date===ed.date).map(r=>r.cart));
  $("#cartChips").innerHTML = [...CARTS,"其他"].map(c=>
    `<button class="chip ${ed.cart===c?"on":""}" data-c="${c}">${c==="其他"?"其他":c}<small>${c==="其他"?"車":"車"}</small>${todayRecs.has(c)?'<span class="dot" title="這天已有紀錄"></span>':""}</button>`).join("");
  $("#otherWrap").style.display = ed.cart==="其他" ? "block" : "none";
}
$("#cartChips").addEventListener("click",async e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  const c=b.dataset.c; if(c===ed.cart) return;
  if(!(await guardDirty())) return;
  buzz(); loadEditorFor(ed.date,c,c==="其他"?"":"");
  $("#inOther").value=""; renderInspect();
  if(c==="其他") setTimeout(()=>$("#inOther").focus(),50);
});
$("#inDate").addEventListener("change",async e=>{
  const v=e.target.value || today();
  if(v===ed.date) return;
  if(!(await guardDirty())){ e.target.value=ed.date; return; }
  loadEditorFor(v,ed.cart,ed.other); renderInspect();
});
let otherT;
$("#inOther").addEventListener("input",e=>{
  clearTimeout(otherT);
  otherT=setTimeout(()=>{
    const v=e.target.value.trim();
    // switching "other" name = switching record; keep current edits if dirty, otherwise load existing
    if(!ed.dirty){ loadEditorFor(ed.date,"其他",v); } else { ed.other=v; saveDraft(); }
    renderInspectBody();
  },350);
});

function renderInspect(){
  $("#inDate").value = ed.date;
  $("#inOther").value = ed.other||"";
  renderCartChips(); renderInspectBody();
}
function renderInspectBody(){
  const body=$("#inspectBody");
  if(!ed.cart){
    body.innerHTML = `<div class="panel empty"><div class="big">⌁</div>請先選擇日期與資訊車<br><span style="font-size:12.5px;color:var(--dim)">選好後會列出 01～40 號平板，預設全部「正常」，只要點有問題的那幾台</span></div>`;
    $("#savebar").classList.remove("show"); return;
  }
  const id=edId(), exists=!!findRec(id);
  const c={ok:0,bad:0,open:0};
  ed.tablets.forEach(t=>{ if(t.issues.length){ c.bad++; if(t.status!=="已修復") c.open++; } else c.ok++; });
  const tag = ed.dirty ? `<span class="tag dirty">未儲存</span>` : exists ? `<span class="tag edit">已存檔</span>` : `<span class="tag new">新紀錄</span>`;
  const r = exists && findRec(id);
  const info = exists ? `已有紀錄，最後更新 ${new Date(r.updatedAt).toLocaleString("zh-TW",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false})}` : "這天這台車尚無紀錄";
  body.innerHTML = `
    <div class="state">${tag}<span>${esc(cartLabel(ed.cart,ed.other))} · ${fmtD(ed.date)}（${wd(ed.date)}） · ${info}</span></div>
    <div class="stats">
      <div class="stat ok"><b>${c.ok}</b><span>正常</span></div>
      <div class="stat bad"><b>${c.bad}</b><span>異常</span></div>
      <div class="stat warn"><b>${c.open}</b><span>未修復</span></div>
    </div>
    <div class="panel">
      <div class="panel-h">平板 01–40<span class="r" style="font-size:12px;color:var(--dim)">點平板設定問題</span></div>
      <div class="grid">${ed.tablets.map((t,i)=>tileHTML(t,i)).join("")}</div>
      <div class="legend">
        <span class="lg-ok">正常</span><span class="lg-bad">待修</span><span class="lg-send">已送修</span><span class="lg-fix">已修復</span><span class="lg-note">有備註</span>
        <span class="abbr">座＝充電座故障　線＝充電線失效　電＝平板無法充電</span>
      </div>
    </div>`;
  $("#savebar").classList.toggle("show", $("#v-inspect").classList.contains("active"));
  $("#saveTxt").textContent = ed.dirty ? (exists?"更新紀錄":"儲存紀錄") : (exists?"已儲存 ✓":"儲存紀錄（全部正常）");
}
function tileHTML(t,i){
  const s=tState(t);
  const iss = t.issues.length ? `<div class="iss">${t.issues.map(x=>`<i>${ISSUE_ABBR[x]}</i>`).join("")}</div>` : `<div class="ok">正常</div>`;
  return `<button class="tile s-${s}" data-i="${i}" aria-label="平板 ${t.no}">${t.note?'<span class="note"></span>':""}<span class="no">${t.no}</span>${iss}</button>`;
}
$("#inspectBody").addEventListener("click",e=>{ const b=e.target.closest(".tile"); if(b){ buzz(); openSheet(+b.dataset.i); } });

$("#btnAllOk").addEventListener("click",async()=>{
  if(!ed.cart) return;
  const n=ed.tablets.filter(t=>t.issues.length||t.note).length;
  if(n && !(await confirmBox("全部設為正常",`會清除目前 ${n} 台的問題與備註，確定嗎？`,"全部正常",true))) return;
  ed.tablets=blankTablets(); markDirty(); toast("40 台已設為正常");
});
$("#btnSave").addEventListener("click",()=>{
  if(!ed.cart) return;
  if(ed.cart==="其他" && !ed.other.trim()){ toast("請輸入「其他車」的車名"); $("#inOther").focus(); return; }
  const id=edId(), now=Date.now();
  const old=findRec(id);
  const rec={id,date:ed.date,cart:ed.cart,other:ed.cart==="其他"?ed.other.trim():"",tablets:JSON.parse(JSON.stringify(ed.tablets)),createdAt:old?old.createdAt:now,updatedAt:now};
  if(old) records[records.indexOf(old)]=rec; else records.push(rec);
  if(!saveRecords()) return;
  ed.dirty=false; saveDraft(); buzz(20);
  const bad=rec.tablets.filter(t=>t.issues.length).length;
  toast(`✓ 已儲存 ${cartLabel(rec.cart,rec.other)} ${fmtD(rec.date)}　異常 ${bad} 台`);
  renderInspect(); updateBadge();
});

/* ================= bottom sheet ================= */
let shI=-1;
function openSheet(i){
  shI=i; renderSheet();
  $("#scrim").classList.add("show"); $("#sheet").classList.add("show");
}
function closeSheet(){
  const note=$("#shNote").value.trim();
  if(shI>=0 && note!==ed.tablets[shI].note){ ed.tablets[shI].note=note; markDirty(); }
  shI=-1; $("#scrim").classList.remove("show"); $("#sheet").classList.remove("show"); $("#shNote").blur();
}
function commitNote(){
  if(shI<0) return;
  const note=$("#shNote").value.trim();
  if(note!==ed.tablets[shI].note){ ed.tablets[shI].note=note; ed.dirty=true; saveDraft(); }
}
function renderSheet(){
  const t=ed.tablets[shI];
  $("#shNo").textContent=t.no;
  $("#shMeta").innerHTML=`號平板<br>${esc(cartLabel(ed.cart,ed.other))} · ${fmtD(ed.date)}`;
  const okOn=!t.issues.length;
  $("#shOpts").innerHTML =
    `<button class="opt round okopt ${okOn?"on":""}" data-o="正常"><span class="box"></span>正常<span class="hint">OK</span></button>` +
    ISSUES.map(x=>`<button class="opt bad ${t.issues.includes(x)?"on":""}" data-o="${x}"><span class="box"></span>${x}<span class="hint">${ISSUE_ABBR[x]}</span></button>`).join("");
  $("#shStatusWrap").style.display = okOn ? "none" : "block";
  $("#shSeg").innerHTML = STATUSES.map(s=>`<button data-v="${s}" class="${t.status===s?"on":""}">${s}</button>`).join("");
  $("#shNote").value=t.note||"";
  $("#shPrev").disabled = shI===0; $("#shNext").disabled = shI===N-1;
}
$("#shOpts").addEventListener("click",e=>{
  const b=e.target.closest(".opt"); if(!b) return; buzz();
  const t=ed.tablets[shI], o=b.dataset.o;
  if(o==="正常"){ t.issues=[]; t.status=""; }
  else{
    t.issues = t.issues.includes(o) ? t.issues.filter(x=>x!==o) : ISSUES.filter(x=>x===o||t.issues.includes(x));
    if(t.issues.length && !t.status) t.status="待修";
    if(!t.issues.length) t.status="";
  }
  commitNote(); markDirty(); renderSheet();
});
$("#shSeg").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return; buzz();
  ed.tablets[shI].status=b.dataset.v; commitNote(); markDirty(); renderSheet();
});
$("#shPrev").addEventListener("click",()=>{ commitNote(); renderInspectBody(); if(shI>0){ shI--; renderSheet(); } });
$("#shNext").addEventListener("click",()=>{ commitNote(); renderInspectBody(); if(shI<N-1){ shI++; renderSheet(); } });
$("#shDone").addEventListener("click",closeSheet);
$("#scrim").addEventListener("click",closeSheet);

/* ================= history view ================= */
let histFilter="全部";
function renderHistory(){
  const carts=["全部",...CARTS,"其他"];
  $("#histFilters").innerHTML = carts.map(c=>`<button class="fchip ${histFilter===c?"on":""}" data-c="${c}">${c==="全部"||c==="其他"?c:c+"車"}</button>`).join("");
  const list = records.filter(r=>histFilter==="全部"||r.cart===histFilter)
    .sort((a,b)=> b.date.localeCompare(a.date) || cartSort(a)-cartSort(b));
  if(!list.length){ $("#histList").innerHTML=`<div class="panel empty"><div class="big">▤</div>${records.length?"這台車還沒有紀錄":"還沒有任何檢修紀錄<br><span style='font-size:12.5px;color:var(--dim)'>到「檢修」頁選車檢查後按儲存</span>"}</div>`; return; }
  let html="", lastM="";
  list.forEach(r=>{
    const m=r.date.slice(0,7);
    if(m!==lastM){ html+=`<div class="month">${m.replace("-"," / ")}</div>`; lastM=m; }
    const bad=r.tablets.filter(t=>t.issues.length);
    const open=bad.filter(t=>t.status!=="已修復").length;
    const cnt=ISSUES.map(x=>[x,bad.filter(t=>t.issues.includes(x)).length]).filter(a=>a[1]);
    const s = bad.length ? `<b>異常 ${bad.length} 台</b>${open?`（未修 ${open}）`:""}　${cnt.map(([x,n])=>`${ISSUE_ABBR[x]}${n}`).join("・")}` : `<span class="g">40 台全部正常</span>`;
    const label=cartShort(r);
    html+=`<div class="rec">
      <div class="cart ${r.cart==="其他"?"other":""}">${esc(label.length>3?label.slice(0,3):label)}</div>
      <div class="body"><div class="d">${fmtD(r.date).slice(5)}<small>週${wd(r.date)} · ${esc(cartLabel(r.cart,r.other))}</small></div><div class="s">${s}</div></div>
      <div class="acts">
        <button class="iconbtn" data-edit="${esc(r.id)}" aria-label="編輯"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></button>
        <button class="iconbtn del" data-del="${esc(r.id)}" aria-label="刪除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
      </div></div>`;
  });
  $("#histList").innerHTML=html;
}
const cartSort = r => r.cart==="其他" ? 99 : CARTS.indexOf(r.cart);
$("#histFilters").addEventListener("click",e=>{ const b=e.target.closest(".fchip"); if(b){ histFilter=b.dataset.c; renderHistory(); } });
$("#histList").addEventListener("click",async e=>{
  const eb=e.target.closest("[data-edit]"), db=e.target.closest("[data-del]");
  if(eb){
    const r=findRec(eb.dataset.edit); if(!r) return;
    if(!(await guardDirty())) return;
    loadEditorFor(r.date,r.cart,r.other); go("inspect");
  }
  if(db){
    const r=findRec(db.dataset.del); if(!r) return;
    if(!(await confirmBox("刪除紀錄",`確定刪除 ${cartLabel(r.cart,r.other)} ${fmtD(r.date)} 的檢修紀錄？\n刪除後無法復原。`,"刪除",true))) return;
    records=records.filter(x=>x!==r); saveRecords();
    if(edId()===r.id && !ed.dirty) loadEditorFor(ed.date,ed.cart,ed.other);
    renderHistory(); updateBadge(); toast("已刪除");
  }
});

/* ================= tracking view ================= */
function trackItems(includeFixed){
  const out=[];
  records.forEach(r=>r.tablets.forEach((t,i)=>{ if(t.issues.length && (includeFixed || t.status!=="已修復")) out.push({r,t,i}); }));
  return out.sort((a,b)=> b.r.date.localeCompare(a.r.date) || cartSort(a.r)-cartSort(b.r) || a.t.no.localeCompare(b.t.no));
}
function updateBadge(){ const n=trackItems(false).length; const b=$("#trkBadge"); b.textContent=n>99?"99+":n; b.classList.toggle("show",n>0); }
function renderTrack(){
  const items=trackItems($("#showFixed").checked);
  if(!items.length){ $("#trackList").innerHTML=`<div class="panel empty"><div class="big">✓</div>目前沒有待處理的平板</div>`; return; }
  $("#trackList").innerHTML = items.map(({r,t,i})=>`
    <div class="trk st-${t.status}">
      <div class="top"><div class="t">${esc(cartLabel(r.cart,r.other))} <span>${t.no}</span> 號</div><div class="dd">${fmtD(r.date)}（${wd(r.date)}）</div></div>
      <div class="is">${t.issues.join("、")}</div>
      ${t.note?`<div class="nt">備註：${esc(t.note)}</div>`:""}
      <div class="seg" data-id="${esc(r.id)}" data-i="${i}">${STATUSES.map(s=>`<button data-v="${s}" class="${t.status===s?"on":""}">${s}</button>`).join("")}</div>
    </div>`).join("");
}
$("#showFixed").addEventListener("change",renderTrack);
$("#trackList").addEventListener("click",e=>{
  const b=e.target.closest(".seg button"); if(!b) return;
  const seg=b.parentElement, r=findRec(seg.dataset.id), i=+seg.dataset.i; if(!r) return;
  r.tablets[i].status=b.dataset.v; r.updatedAt=Date.now(); saveRecords(); buzz();
  if(edId()===r.id){ ed.tablets[i].status=b.dataset.v; saveDraft(); }
  updateBadge(); renderTrack();
  toast(`${cartLabel(r.cart,r.other)} ${r.tablets[i].no} 號 → ${b.dataset.v}`);
});

/* ================= export view ================= */
let exCarts=new Set([...CARTS,"其他"]);
function initExport(){
  if(!$("#exFrom").value){
    const d=new Date(); $("#exTo").value=ymd(d);
    const first=records.length ? records.map(r=>r.date).sort()[0] : ymd(new Date(d.getFullYear(),d.getMonth(),1));
    $("#exFrom").value=first;
  }
  $("#exRange").innerHTML=[["本週","w"],["本月","m"],["上個月","pm"],["本學期","sem"],["全部","all"]].map(([t,k])=>`<button class="fchip" data-k="${k}">${t}</button>`).join("");
  renderExCarts(); renderExPreview(); renderDataInfo();
}
function renderExCarts(){
  $("#exCarts").innerHTML=[...CARTS,"其他"].map(c=>`<button class="fchip ${exCarts.has(c)?"on":""}" data-c="${c}">${c==="其他"?"其他車":c+"車"}</button>`).join("");
}
$("#exCarts").addEventListener("click",e=>{ const b=e.target.closest(".fchip"); if(!b) return; const c=b.dataset.c; exCarts.has(c)?exCarts.delete(c):exCarts.add(c); renderExCarts(); renderExPreview(); });
$("#exRange").addEventListener("click",e=>{
  const b=e.target.closest(".fchip"); if(!b) return;
  const d=new Date(), y=d.getFullYear(), m=d.getMonth(); let f,t=d;
  switch(b.dataset.k){
    case "w": f=new Date(d); f.setDate(d.getDate()-((d.getDay()+6)%7)); break;
    case "m": f=new Date(y,m,1); break;
    case "pm": f=new Date(y,m-1,1); t=new Date(y,m,0); break;
    case "sem": f = (m>=7) ? new Date(y,7,1) : (m===0) ? new Date(y-1,7,1) : new Date(y,1,1); break; // 8/1 or 2/1
    case "all": f = records.length ? parseD(records.map(r=>r.date).sort()[0]) : new Date(y,m,1); break;
  }
  $("#exFrom").value=ymd(f); $("#exTo").value=ymd(t); renderExPreview();
});
["#exFrom","#exTo","#exOnlyBad"].forEach(s=>$(s).addEventListener("change",renderExPreview));
function exSelected(){
  let f=$("#exFrom").value, t=$("#exTo").value; if(f&&t&&f>t) [f,t]=[t,f];
  return records.filter(r=>(!f||r.date>=f)&&(!t||r.date<=t)&&exCarts.has(r.cart))
    .sort((a,b)=>a.date.localeCompare(b.date)||cartSort(a)-cartSort(b)||(a.other||"").localeCompare(b.other||""));
}
function renderExPreview(){
  const sel=exSelected(); const bad=sel.reduce((n,r)=>n+r.tablets.filter(t=>t.issues.length).length,0);
  $("#exPreview").innerHTML=`<div class="kv"><span>符合的檢查紀錄</span><b>${sel.length} 次</b></div><div class="kv"><span>檢查台次 / 異常台次</span><b>${sel.length*N} / <span style="color:var(--bad)">${bad}</span></b></div>`;
  $("#btnXlsx").disabled=$("#btnShare").disabled=!sel.length;
}

async function buildWorkbook(){
  if(!window.ExcelJS){ toast("Excel 模組載入中，請稍候再試"); return null; }
  const sel=exSelected(); const onlyBad=$("#exOnlyBad").checked;
  let f=$("#exFrom").value, t=$("#exTo").value; if(f>t) [f,t]=[t,f];
  const wb=new ExcelJS.Workbook(); wb.creator="資訊車平板檢修記錄"; wb.created=new Date();
  const FONT="微軟正黑體";
  const thin={style:"thin",color:{argb:"FFB7C4D6"}};
  const border={top:thin,left:thin,bottom:thin,right:thin};
  const xd=str=>{ const [y,m,d]=str.split("-").map(Number); return new Date(Date.UTC(y,m-1,d)); }; // Excel 日期不受時區影響
  const HEAD={type:"pattern",pattern:"solid",fgColor:{argb:"FF0B2545"}};
  const fill=c=>({type:"pattern",pattern:"solid",fgColor:{argb:c}});
  const stamp=new Date(); const stampS=`${ymd(stamp)} ${pad(stamp.getHours())}:${pad(stamp.getMinutes())}`;
  const rangeS=`${fmtD(f)} ～ ${fmtD(t)}`;
  const cartsS = exCarts.size===7 ? "全部" : [...CARTS,"其他"].filter(c=>exCarts.has(c)).map(c=>c==="其他"?"其他車":c+"車").join("、");

  function titleBlock(ws,title,cols){
    ws.mergeCells(1,1,1,cols); ws.mergeCells(2,1,2,cols);
    const a=ws.getCell(1,1); a.value=title; a.font={name:FONT,size:16,bold:true,color:{argb:"FF0B2545"}}; a.alignment={vertical:"middle"};
    const b=ws.getCell(2,1); b.value=`期間：${rangeS}　資訊車：${cartsS}　匯出時間：${stampS}`; b.font={name:FONT,size:10,color:{argb:"FF5B6B82"}};
    ws.getRow(1).height=28;
  }
  function header(ws,rowNo,cols){
    const row=ws.getRow(rowNo); row.values=cols; row.height=24;
    row.eachCell(c=>{ c.font={name:FONT,bold:true,color:{argb:"FFFFFFFF"},size:11}; c.fill=HEAD; c.alignment={horizontal:"center",vertical:"middle",wrapText:true}; c.border=border; });
  }
  const stFill={"待修":"FFFDE2E2","已送修":"FFFEF3C7","已修復":"FFDBEAFE"};
  const stFont={"待修":"FFB91C1C","已送修":"FFB45309","已修復":"FF1D4ED8"};

  /* --- 明細：每台車一張工作表 --- */
  function detailSheet(sheetName,recs,showCart){
    const ws=wb.addWorksheet(sheetName,{views:[{state:"frozen",ySplit:3}]});
    const cols=showCart
      ? ["日期","星期","資訊車","平板編號","檢查結果","充電座故障","充電線失效","平板無法充電","處理狀態","備註"]
      : ["日期","星期","平板編號","檢查結果","充電座故障","充電線失效","平板無法充電","處理狀態","備註"];
    const widths=showCart?[12,6,12,9,9,11,11,14,10,34]:[12,6,9,9,11,11,14,10,34];
    const off=showCart?1:0; // 欄位位移
    titleBlock(ws,`${sheetName}　平板檢修記錄表`,cols.length); header(ws,3,cols);
    widths.forEach((w,i)=>ws.getColumn(i+1).width=w);
    let rn=4, lastDate="";
    recs.forEach(r=>r.tablets.forEach(tb=>{
      const bad=tb.issues.length>0; if(onlyBad && !bad) return;
      const row=ws.getRow(rn++);
      const v=[xd(r.date),wd(r.date)]; if(showCart) v.push(cartLabel(r.cart,r.other));
      row.values=[...v,tb.no,bad?"異常":"正常",...ISSUES.map(x=>tb.issues.includes(x)?"✔":""),bad?tb.status:"",tb.note||""];
      const noteCol=cols.length;
      row.eachCell({includeEmpty:true},(c,ci)=>{
        if(ci>cols.length) return;
        c.border=border; c.font={name:FONT,size:11}; c.alignment={horizontal:ci===noteCol?"left":"center",vertical:"middle",wrapText:ci===noteCol};
        if(bad) c.fill=fill("FFFFF5F5");
      });
      // 換日時加粗上框線，方便分辨不同次檢查
      if(lastDate && r.date!==lastDate) row.eachCell({includeEmpty:true},(c,ci)=>{ if(ci<=cols.length) c.border={...border,top:{style:"medium",color:{argb:"FF0B2545"}}}; });
      lastDate=r.date;
      row.getCell(1).numFmt="yyyy/mm/dd";
      row.getCell(4+off).font={name:FONT,size:11,bold:bad,color:{argb:bad?"FFDC2626":"FF15803D"}};
      for(let k=5+off;k<=7+off;k++) if(row.getCell(k).value) row.getCell(k).font={name:FONT,size:12,bold:true,color:{argb:"FFDC2626"}};
      if(bad && tb.status){ const c=row.getCell(8+off); c.fill=fill(stFill[tb.status]); c.font={name:FONT,size:11,bold:true,color:{argb:stFont[tb.status]}}; }
    }));
    if(rn===4) ws.getCell(4,1).value = onlyBad ? "（此範圍內沒有異常平板 👍）" : "（此範圍內沒有資料）";
    ws.autoFilter={from:{row:3,column:1},to:{row:Math.max(rn-1,3),column:cols.length}};
    ws.pageSetup={orientation:"landscape",fitToPage:true,fitToWidth:1,fitToHeight:0,paperSize:9,printTitlesRow:"3:3"};
  }

  /* --- Sheet 2 統計 --- */
  const s2=wb.addWorksheet("統計摘要");
  const c2=["資訊車","檢查次數","檢查台次","正常台次","異常台次","異常率","充電座故障","充電線失效","平板無法充電","未修復台次"];
  titleBlock(s2,"檢修統計摘要",c2.length); header(s2,3,c2);
  [14,10,10,10,10,9,11,11,12,11].forEach((w,i)=>s2.getColumn(i+1).width=w);
  const groups=new Map();
  sel.forEach(r=>{ const k=cartLabel(r.cart,r.other); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(r); });
  let r2=4;
  const gOrder=[...groups.entries()].sort((a,b)=>cartSort(a[1][0])-cartSort(b[1][0])||a[0].localeCompare(b[0]));
  for(const [k,rs] of gOrder){
    const all=rs.flatMap(r=>r.tablets), bad=all.filter(x=>x.issues.length);
    const row=s2.getRow(r2);
    row.values=[k,rs.length,all.length,all.length-bad.length,bad.length,{formula:`IF(C${r2}=0,0,E${r2}/C${r2})`,result:all.length?bad.length/all.length:0},
      ...ISSUES.map(x=>bad.filter(t=>t.issues.includes(x)).length), bad.filter(t=>t.status!=="已修復").length];
    r2++;
  }
  const first=4,last=r2-1;
  if(last>=first){
    const tot=s2.getRow(r2);
    tot.values=["合計",...["B","C","D","E"].map(L=>({formula:`SUM(${L}${first}:${L}${last})`})),{formula:`IF(C${r2}=0,0,E${r2}/C${r2})`},...["G","H","I","J"].map(L=>({formula:`SUM(${L}${first}:${L}${last})`}))];
    // cached results so phones/previewers show numbers immediately
    const sumCol=ci=>{ let s=0; for(let i=first;i<=last;i++) s+=Number(s2.getCell(i,ci).value)||0; return s; };
    [2,3,4,5,7,8,9,10].forEach(ci=>{ const c=tot.getCell(ci); c.value={formula:c.value.formula,result:sumCol(ci)}; });
    const C=sumCol(3),E=sumCol(5); tot.getCell(6).value={formula:`IF(C${r2}=0,0,E${r2}/C${r2})`,result:C?E/C:0};
    tot.eachCell(c=>{ c.font={name:FONT,bold:true,size:11}; c.fill=fill("FFE0F2FE"); });
  }
  for(let i=4;i<=r2 && last>=first;i++){
    const row=s2.getRow(i);
    for(let ci=1;ci<=c2.length;ci++){ const c=row.getCell(ci); c.border=border; c.alignment={horizontal:"center",vertical:"middle"}; if(!c.font||!c.font.bold) c.font={name:FONT,size:11}; }
    row.getCell(6).numFmt="0.0%";
  }
  if(last<first) s2.getCell(4,1).value="（此範圍內沒有資料）";

  /* --- 各車明細工作表（統計摘要之後）--- */
  CARTS.filter(k=>exCarts.has(k)).forEach(k=>{ const rs=sel.filter(r=>r.cart===k); if(rs.length) detailSheet(`${k}車`,rs,false); });
  if(exCarts.has("其他")){ const rs=sel.filter(r=>r.cart==="其他"); if(rs.length) detailSheet("其他車",rs,true); }

  /* --- Sheet 3 待修清單 --- */
  const s3=wb.addWorksheet("待修清單",{views:[{state:"frozen",ySplit:3}]});
  const c3=["日期","資訊車","平板編號","問題","處理狀態","備註"];
  titleBlock(s3,"待修清單（尚未修復）",c3.length); header(s3,3,c3);
  [12,14,9,30,10,34].forEach((w,i)=>s3.getColumn(i+1).width=w);
  let r3=4;
  sel.forEach(r=>r.tablets.forEach(tb=>{
    if(!tb.issues.length||tb.status==="已修復") return;
    const row=s3.getRow(r3++); row.values=[xd(r.date),cartLabel(r.cart,r.other),tb.no,tb.issues.join("、"),tb.status,tb.note||""];
    row.eachCell({includeEmpty:true},(c,ci)=>{ if(ci>c3.length) return; c.border=border; c.font={name:FONT,size:11}; c.alignment={horizontal:ci>=4&&ci!==5?"left":"center",vertical:"middle",wrapText:true}; });
    row.getCell(1).numFmt="yyyy/mm/dd";
    row.getCell(5).fill=fill(stFill[tb.status]||"FFFFFFFF"); row.getCell(5).font={name:FONT,size:11,bold:true,color:{argb:stFont[tb.status]||"FF000000"}};
  }));
  if(r3===4) s3.getCell(4,1).value="（沒有待修平板 👍）";

  /* --- Sheet 4 異常次數 --- */
  const s4=wb.addWorksheet("平板異常次數");
  const c4=["資訊車","平板編號","異常次數","充電座故障","充電線失效","平板無法充電","最近異常日期"];
  titleBlock(s4,"平板異常次數排行（找出常故障的平板／充電座）",c4.length); header(s4,3,c4);
  [14,9,9,11,11,12,14].forEach((w,i)=>s4.getColumn(i+1).width=w);
  const freq=new Map();
  sel.forEach(r=>r.tablets.forEach(tb=>{
    if(!tb.issues.length) return;
    const k=cartLabel(r.cart,r.other)+"|"+tb.no;
    const o=freq.get(k)||{cart:cartLabel(r.cart,r.other),no:tb.no,n:0,c:{},last:""};
    o.n++; tb.issues.forEach(x=>o.c[x]=(o.c[x]||0)+1); if(r.date>o.last) o.last=r.date; freq.set(k,o);
  }));
  let r4=4;
  [...freq.values()].sort((a,b)=>b.n-a.n||a.cart.localeCompare(b.cart)||a.no.localeCompare(b.no)).forEach(o=>{
    const row=s4.getRow(r4++); row.values=[o.cart,o.no,o.n,...ISSUES.map(x=>o.c[x]||0),xd(o.last)];
    row.eachCell({includeEmpty:true},(c,ci)=>{ if(ci>c4.length) return; c.border=border; c.font={name:FONT,size:11}; c.alignment={horizontal:"center",vertical:"middle"}; });
    row.getCell(7).numFmt="yyyy/mm/dd";
    if(o.n>=3){ row.getCell(3).font={name:FONT,size:11,bold:true,color:{argb:"FFDC2626"}}; row.getCell(3).fill=fill("FFFDE2E2"); }
  });
  if(r4===4) s4.getCell(4,1).value="（此範圍內沒有異常紀錄）";

  const buf=await wb.xlsx.writeBuffer();
  const name=`平板檢修記錄_${f.replace(/-/g,"")}-${t.replace(/-/g,"")}.xlsx`;
  return {blob:new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),name};
}
function downloadBlob(blob,name){
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
$("#btnXlsx").addEventListener("click",async()=>{
  const b=$("#btnXlsx"); b.disabled=true;
  try{ const o=await buildWorkbook(); if(o){ downloadBlob(o.blob,o.name); toast("已下載："+o.name); } }
  catch(e){ console.error(e); toast("產生報表失敗："+e.message); }
  finally{ b.disabled=false; }
});
$("#btnShare").addEventListener("click",async()=>{
  try{
    const o=await buildWorkbook(); if(!o) return;
    const file=new File([o.blob],o.name,{type:o.blob.type});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:o.name}); }
    else{ downloadBlob(o.blob,o.name); toast("此裝置不支援分享，已改為下載"); }
  }catch(e){ if(e.name!=="AbortError"){ console.error(e); toast("分享失敗："+e.message); } }
});

/* data management */
async function renderDataInfo(){
  const tabs=records.length*N, bad=records.reduce((n,r)=>n+r.tablets.filter(t=>t.issues.length).length,0);
  let persist="—";
  try{ if(navigator.storage&&navigator.storage.persisted) persist = (await navigator.storage.persisted()) ? "已鎖定（不會被系統清除）" : "一般"; }catch(e){}
  const dates=records.map(r=>r.date).sort();
  $("#dataInfo").innerHTML=`
    <div class="kv"><span>檢修紀錄</span><b>${records.length} 次</b></div>
    <div class="kv"><span>累計檢查台次 / 異常</span><b>${tabs} / ${bad}</b></div>
    <div class="kv"><span>資料期間</span><b>${dates.length?fmtD(dates[0])+" – "+fmtD(dates[dates.length-1]):"—"}</b></div>
    <div class="kv"><span>儲存保護</span><b style="font-family:var(--sans)">${persist}</b></div>`;
}
$("#btnBackup").addEventListener("click",()=>{
  const data={app:"tablet-inspection",version:1,exportedAt:new Date().toISOString(),records};
  const d=new Date();
  downloadBlob(new Blob([JSON.stringify(data,null,1)],{type:"application/json"}),`平板檢修備份_${ymd(d).replace(/-/g,"")}.json`);
  toast("備份檔已下載");
});
$("#btnRestore").addEventListener("click",()=>$("#fileRestore").click());
$("#fileRestore").addEventListener("change",async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  try{
    const data=JSON.parse(await f.text());
    const incoming=Array.isArray(data)?data:data.records;
    if(!Array.isArray(incoming)||incoming.some(r=>!r.id||!r.date||!r.cart||!Array.isArray(r.tablets))) throw new Error("格式不符");
    const map=new Map(records.map(r=>[r.id,r])); let add=0,upd=0;
    incoming.forEach(r=>{ const o=map.get(r.id); if(!o){add++; map.set(r.id,r);} else if((r.updatedAt||0)>(o.updatedAt||0)){upd++; map.set(r.id,r);} });
    if(!(await confirmBox("還原備份",`備份內有 ${incoming.length} 筆紀錄。\n將新增 ${add} 筆、以較新版本更新 ${upd} 筆，現有其他資料保留。`,"開始還原"))) return;
    records=[...map.values()]; saveRecords(); updateBadge(); renderDataInfo(); renderExPreview(); toast(`還原完成：新增 ${add}、更新 ${upd}`);
  }catch(err){ toast("無法讀取備份檔："+err.message); }
});
$("#btnWipe").addEventListener("click",async()=>{
  if(!records.length){ toast("目前沒有資料"); return; }
  if(!(await confirmBox("清除全部資料",`將刪除全部 ${records.length} 筆檢修紀錄，無法復原。\n建議先按「備份資料」。`,"下一步",true))) return;
  if(!(await confirmBox("再次確認","真的要清除全部資料嗎？","全部清除",true))) return;
  records=[]; saveRecords(); ed={date:today(),cart:"",other:"",tablets:blankTablets(),dirty:false}; saveDraft();
  updateBadge(); renderDataInfo(); renderExPreview(); toast("已清除全部資料");
});

/* ================= navigation ================= */
function go(v){
  document.querySelectorAll(".view").forEach(s=>s.classList.toggle("active",s.id==="v-"+v));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  $("#savebar").classList.toggle("show", v==="inspect" && !!ed.cart);
  if(v==="inspect") renderInspect();
  if(v==="history") renderHistory();
  if(v==="track") renderTrack();
  if(v==="export") initExport();
  window.scrollTo({top:0});
}
document.querySelector("nav").addEventListener("click",e=>{ const b=e.target.closest("button"); if(b){ buzz(); go(b.dataset.v); } });
window.addEventListener("beforeunload",e=>{ if(ed.dirty){ saveDraft(); } });

/* ================= init ================= */
renderInspect(); updateBadge();
if(ed.dirty) toast("已恢復上次未儲存的檢查");
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
if("serviceWorker" in navigator && location.protocol==="https:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
